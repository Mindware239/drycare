# Local infrastructure for DryCare. Ports are offset to avoid clashing with other local databases.
services:
  postgres:
    image: postgres:17-alpine
    container_name: drycare-postgres
    environment:
      POSTGRES_USER: drycare
      POSTGRES_PASSWORD: drycare_dev
      POSTGRES_DB: drycare
    ports:
      - "5440:5432"
    volumes:
      - drycare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drycare"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: drycare-redis
    ports:
      - "6390:6379"
volumes:
  drycare_pg:
