<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f6a5d">
  <title>Offline · DryCare</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7f8; color: #0f172a; padding: 24px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } .card { background: #111827 !important; border-color: #263449 !important; } p { color: #94a3b8 !important; } }
    .card { max-width: 380px; width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px 24px; text-align: center; }
    img { width: 56px; height: 56px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: #475569; font-size: 14px; line-height: 1.5; }
    button { width: 100%; border: 0; border-radius: 10px; background: #0f6a5d; color: #fff; font-size: 15px; font-weight: 600; padding: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>DryCare could not reach the shop system. Check that this phone is on the shop Wi-Fi (or has internet), then try again. Nothing you entered has been lost on the shop computer.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
